name: Publish Pi fork release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Source release channel already maintained and committed by the agent
        required: true
        type: choice
        options: [stable, nightly]
      upstream_tag:
        description: Exact pingdotgg/t3code GitHub Release tag recorded in patches/<channel>/
        required: true
        type: string
      fork_tag:
        description: Fork GitHub Release tag (for example pi-v0.0.36-nightly.20260827.1205)
        required: true
        type: string
      assets:
        description: Glob of already-built, signed updater assets to upload; leave blank for source-only release
        required: false
        default: release-assets/*
        type: string

permissions:
  contents: write

concurrency:
  group: pi-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify agent-maintained patch manifest
        env:
          CHANNEL: ${{ inputs.channel }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: node tools/verify-release.mjs "$CHANNEL" "$UPSTREAM_TAG"
      - name: Build patched source archive
        env:
          CHANNEL: ${{ inputs.channel }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          FORK_TAG: ${{ inputs.fork_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_TAG" https://github.com/pingdotgg/t3code.git source
          mapfile -t patches < <(find "patches/$CHANNEL/$UPSTREAM_TAG" -maxdepth 1 -name '*.patch' -print | sort)
          if ((${#patches[@]})); then git -C source am "${patches[@]/#/$GITHUB_WORKSPACE/}"; fi
          tar -C source -czf "t3code-pi-source-$FORK_TAG.tar.gz" --exclude=.git .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          FORK_TAG: ${{ inputs.fork_tag }}
          ASSET_GLOB: ${{ inputs.assets }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$CHANNEL" == nightly ]] && prerelease=(--prerelease)
          assets=("t3code-pi-source-$FORK_TAG.tar.gz")
          shopt -s nullglob
          for asset in $ASSET_GLOB; do assets+=("$asset"); done
          gh release create "$FORK_TAG" "${assets[@]}" "${prerelease[@]}" \
            --title "T3 Code Pi $FORK_TAG" \
            --notes "Pi fork of pingdotgg/t3code $UPSTREAM_TAG. Patch manifest: patches/$CHANNEL/$UPSTREAM_TAG/manifest.json"
