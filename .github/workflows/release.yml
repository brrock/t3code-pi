name: Publish Pi fork release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Maintained upstream release channel
        required: true
        type: choice
        options: [stable, nightly]
      upstream_tag:
        description: Exact upstream tag recorded in patches/<channel>/
        required: true
        type: string
      version:
        description: Exact upstream semver, or an immutable numeric Pi rebuild suffix (`-pi.N`)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: pi-release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: pingdotgg/t3code

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify release input and patch manifest
        env:
          CHANNEL: ${{ inputs.channel }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node tools/verify-release.mjs "$CHANNEL" "$UPSTREAM_TAG"
          node -e 'if (!/^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)' "$VERSION" || { echo "version must be semver" >&2; exit 1; }
          node --input-type=module -e 'import { releaseVersionMatches } from "./tools/maintenance-lib.mjs"; if (!releaseVersionMatches(process.argv[1], process.argv[2])) process.exit(1)' "$UPSTREAM_TAG" "$VERSION" || { echo "version must equal upstream_tag or use its numeric -pi.N rebuild suffix" >&2; exit 1; }
      - id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          echo "release_tag=pi-v$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$([[ "$CHANNEL" == nightly ]] && echo nightly || echo latest)" >> "$GITHUB_OUTPUT"
      - name: Create patched, fork-branded source tree
        env:
          CHANNEL: ${{ inputs.channel }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_TAG" "https://github.com/$UPSTREAM_REPOSITORY.git" source
          git -C source config user.name "Brrock Agent"
          git -C source config user.email "benjy@benjyross.xyz"
          mapfile -t patches < <(find "patches/$CHANNEL/$UPSTREAM_TAG" -maxdepth 1 -name '*.patch' -print | sort)
          ((${#patches[@]})) || { echo "No patch series for this release" >&2; exit 1; }
          git -C source am "${patches[@]/#/$GITHUB_WORKSPACE/}"
          node tools/prepare-release-source.mjs source
          # Preserve dotfiles needed by downstream build jobs, without packaging clone metadata.
          rm -rf source/.git
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-source
          path: source
          include-hidden-files: true
          retention-days: 1

  publish_npm:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: prepared-source
          path: source
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: source/package.json
          run-install: false
      - name: Set release version and build CLI
        working-directory: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cp .env.example .env
          vp install --filter=@brrock/t3-pi... --filter=@t3tools/web... --filter=@t3tools/scripts...
          node scripts/update-release-package-versions.ts "${VERSION#v}"
          vp run --filter @brrock/t3-pi build
      - name: Publish fork CLI
        working-directory: source
        env:
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          # A retried release must not attempt to republish an immutable npm version.
          if npm view "@brrock/t3-pi@${VERSION#v}" version >/dev/null 2>&1; then
            echo "@brrock/t3-pi@${VERSION#v} is already published; skipping publish."
            exit 0
          fi
          node apps/server/scripts/cli.ts publish --tag "$NPM_TAG" --app-version "${VERSION#v}" --provenance --verbose

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - runner: windows-2025
            platform: win
            target: nsis
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: prepared-source
          path: source
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: source/package.json
          run-install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install build dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          vp install --filter=@t3tools/desktop... --filter=@brrock/t3-pi... --filter=@t3tools/scripts...
      # This fork intentionally publishes unsigned builds. Users may need to
      # bypass OS trust prompts on first install; GitHub updater metadata still
      # provides in-app version discovery and downloads.
      - name: Build unsigned desktop updater assets
        working-directory: source
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: brrock/t3code-pi
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "${VERSION#v}"
          args=(--platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}" --build-version "${VERSION#v}" --verbose)
          vp run dist:desktop:artifact "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            source/release/*.dmg
            source/release/*.zip
            source/release/*.AppImage
            source/release/*.exe
            source/release/*.blockmap
            source/release/*.yml
          if-no-files-found: error

  release:
    needs: [prepare, publish_npm, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: assets
      - name: Publish desktop updater release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$CHANNEL" == nightly ]] && prerelease=(--prerelease)
          notes_file="$RUNNER_TEMP/upstream-release-notes.md"
          gh api "repos/$UPSTREAM_REPOSITORY/releases/tags/$UPSTREAM_TAG" --jq .body > "$notes_file"
          printf '\n\n---\n\n_Pi fork release of [%s@%s](https://github.com/%s/releases/tag/%s). Includes the Pi provider integration, npm package `@brrock/t3-pi`, and desktop updater assets._\n' \
            "$UPSTREAM_REPOSITORY" "$UPSTREAM_TAG" "$UPSTREAM_REPOSITORY" "$UPSTREAM_TAG" >> "$notes_file"
          gh release create "$TAG" assets/* "${prerelease[@]}" --repo "$GITHUB_REPOSITORY" --title "T3 Code Pi $TAG" --notes-file "$notes_file"
